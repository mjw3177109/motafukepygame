name: SWF Original Audit
on:
  workflow_dispatch:
  push:
    branches: [feature/mota112-swf-audit-foundation]
    paths:
      - 'game.swf'
      - 'FFDec/**'
      - 'data/original_floors.json'
      - 'data/original_sprite_symbol_anchors.json'
      - 'data/original_sprite_frame_anchors.json'
      - 'core/floor_tile_plan.py'
      - 'tools/**'
      - 'tests/test_swf_audit_triggers.py'
      - 'tests/test_trace_swf_symbols.py'
      - 'tests/test_audit_swf_sprite_frames.py'
      - '.github/workflows/swf-audit.yml'
  pull_request:
    paths:
      - 'game.swf'
      - 'FFDec/**'
      - 'data/original_floors.json'
      - 'data/original_sprite_symbol_anchors.json'
      - 'data/original_sprite_frame_anchors.json'
      - 'core/floor_tile_plan.py'
      - 'tools/**'
      - 'tests/test_swf_audit_triggers.py'
      - 'tests/test_trace_swf_symbols.py'
      - 'tests/test_audit_swf_sprite_frames.py'
      - '.github/workflows/swf-audit.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/extract_swf.py --swf game.swf --ffdec FFDec/ffdec.jar --out .swf_audit
      - name: Extract original map and monster tables
        run: |
          SWF_SHA=$(python -c 'import json; print(json.load(open(".swf_audit/manifest.json"))["original"]["sha256"])')
          python tools/extract_original_tables.py --script .swf_audit/export/scripts/frame_4346/DoAction.as --swf-sha256 "$SWF_SHA" --out .swf_audit/original_tables.json
      - name: Verify all 3267 committed floor cells against hashed original ActionScript
        run: |
          python tools/verify_original_floors.py --committed data/original_floors.json --extracted .swf_audit/original_tables.json --export-root .swf_audit
      - name: Audit original floor sprite alias coverage (no false parity)
        run: python tools/audit_floor_assets.py --floors data/original_floors.json --manifest .swf_audit/manifest.json --out .swf_audit/floor_asset_coverage.json
      - name: Trace original ExportAssets sprites to hashed shape exports
        run: |
          python tools/trace_swf_symbols.py --tags .swf_audit/ffdec_tags.log --manifest .swf_audit/manifest.json --coverage .swf_audit/floor_asset_coverage.json --export-root .swf_audit/export --anchors data/original_sprite_symbol_anchors.json --out .swf_audit/swf_symbol_trace.json
      - name: Verify original sprite declared frames against ShowFrame tags
        run: |
          python tools/audit_swf_sprite_frames.py --tags .swf_audit/ffdec_tags.log --trace .swf_audit/swf_symbol_trace.json --anchors data/original_sprite_frame_anchors.json --out .swf_audit/swf_sprite_frames.json
      - name: Preserve case-distinct FFDec exports and verify archive bytes
        run: |
          python tools/package_swf_audit.py --manifest .swf_audit/manifest.json --export-root .swf_audit/export --archive .swf_audit/ffdec_export.tar.gz --report .swf_audit/export_archive_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-flash-audit
          # Never upload raw export/: upload-artifact treats case-only filenames as duplicates.
          path: |
            .swf_audit/swf_header.json
            .swf_audit/manifest.json
            .swf_audit/original_tables.json
            .swf_audit/floor_asset_coverage.json
            .swf_audit/swf_symbol_trace.json
            .swf_audit/swf_sprite_frames.json
            .swf_audit/export_archive_report.json
            .swf_audit/ffdec_*.log
            .swf_audit/ffdec_export.tar.gz
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
