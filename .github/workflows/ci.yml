name: Python tooling tests
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - run: python -m unittest discover -s tests -v
      - name: Run all JavaScript regression tests (fail closed)
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_*.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo 'No JavaScript regression tests discovered' >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            node --test "$test_file" || exit 1
          done
      - run: python tools/swf_probe.py game.swf --output /tmp/swf_original.json
